<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="10" y1="9" x2="22" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="16" y1="13.5" x2="22" y2="23.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="10" y1="13.5" x2="16" y2="23.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Cyber Shield -->
  <path d="M16 2.5 L27 6.2 C27 15.5 22.2 23.5 16 29.5 C9.8 23.5 5 15.5 5 6.2 L16 2.5 Z" 
        fill="#0b1120" 
        stroke="url(#shieldGrad)" 
        stroke-width="2" 
        stroke-linejoin="round"/>
        
  <!-- Inner Container / Dock Isometric Cube -->
  <!-- Top Face -->
  <path d="M16 9.5 L21.5 12.7 L16 15.8 L10.5 12.7 Z" fill="url(#boxTop)" stroke="#0b1120" stroke-width="0.6"/>
  <!-- Left Face -->
  <path d="M10.5 13.5 L15.5 16.4 V22.2 L10.5 19.3 Z" fill="url(#boxLeft)" stroke="#0b1120" stroke-width="0.6"/>
  <!-- Right Face -->
  <path d="M16.5 16.4 L21.5 13.5 V19.3 L16.5 22.2 Z" fill="url(#boxRight)" stroke="#0b1120" stroke-width="0.6"/>

  <!-- Cyber Accent Node -->
  <circle cx="16" cy="6" r="1.2" fill="#38bdf8"/>
</svg>